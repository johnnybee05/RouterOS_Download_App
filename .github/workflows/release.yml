name: release

# Podepsaný .exe vzniká výhradně odsud. SignPath Foundation podepíše jen
# binárku, o které si sám ověří, že vznikla z tohohle repozitáře na runneru
# GitHubu (origin verification) – ručně sestavený .exe nahraný k releasu by
# zůstal nepodepsaný. Nastavení a postup: docs/CODE-SIGNING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # nahrání .exe k releasu
  actions: read # SignPath si přečte detaily běhu a stáhne artefakt

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Tou samou verzí se .exe sestavuje i lokálně (viz README).
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Tag a rosdl.__version__ musí souhlasit – updater porovnává verzi
      # z GitHubu s tou zakompilovanou, takže rozchod by znamenal, že si
      # aplikace nabízí aktualizaci sama na sebe, nebo žádnou.
      - name: Kontrola tagu proti rosdl.__version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $version = python -c "from rosdl import __version__; print(__version__)"
          Write-Host "tag $tag / rosdl $version"
          if ($tag -ne $version) {
            throw "Tag $tag neodpovídá rosdl.__version__ = $version"
          }

      - name: Sestavení RosDownloader.exe
        env:
          # Runner nemá plochu a build.ps1 cestou pouští i GUI testy.
          QT_QPA_PLATFORM: offscreen
        run: .\build.ps1 -Python (Get-Command python).Source

      # SignPath si artefakt stahuje přes API GitHubu, takže musí nejdřív
      # vzniknout jako artefakt běhu. Zabalí se do ZIPu – s tím musí počítat
      # i artifact configuration na straně SignPathu.
      - name: Nahrání nepodepsaného artefaktu
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: RosDownloader-unsigned
          path: dist/RosDownloader.exe
          if-no-files-found: error

      # Dokud není projekt u SignPath Foundation schválený, chybí proměnné
      # a krok se přeskočí: vznikne nepodepsaný .exe, jen se to řekne nahlas.
      - name: Žádost o podpis u SignPath
        id: signpath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # Vydávat má smysl jen podpis, který projde ověřením – kdyby SignPath
      # vrátil soubor bez podpisu, na releasu by si toho nikdo nevšiml.
      - name: Ověření podpisu
        if: steps.signpath.outcome == 'success'
        run: |
          $signature = Get-AuthenticodeSignature .\signed\RosDownloader.exe
          $signature | Format-List Status, StatusMessage
          if ($signature.Status -ne "Valid") {
            throw "Podpis není platný: $($signature.Status) – $($signature.StatusMessage)"
          }
          Write-Host "vydavatel: $($signature.SignerCertificate.Subject)"

      - name: Příprava souborů k vydání
        id: collect
        run: |
          $signed = Test-Path .\signed\RosDownloader.exe
          $source = if ($signed) { ".\signed\RosDownloader.exe" } else { ".\dist\RosDownloader.exe" }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $source .\release\RosDownloader.exe -Force
          $hash = (Get-FileHash .\release\RosDownloader.exe -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "signed=$($signed.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "SHA256 $hash"
          if (-not $signed) {
            Write-Warning "SignPath není nastaven – vzniká NEPODEPSANÝ .exe."
          }

      # Popis vydání se píše ručně, takže ho tenhle workflow nikdy nepřepisuje.
      # Když release pro tag ještě není, založí se jako koncept jen s otiskem
      # a je na člověku doplnit text a vydat. Otisk patří do popisu i proto,
      # že ho updater umí přečíst, když GitHub u přílohy nepošle pole digest
      # (viz rosdl/core/updater.py).
      - name: Nahrání .exe k releasu
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Chybějící release se pozná jen podle návratového kódu `gh`, takže
          # tady nesmí nenulový kód sám shodit krok – kontroluje se ručně.
          $ErrorActionPreference = "Continue"
          $tag = "${{ github.ref_name }}"
          $lines = @("SHA256: ${{ steps.collect.outputs.sha256 }}", "")
          if ("${{ steps.collect.outputs.signed }}" -eq "true") {
            $lines += 'Soubor je podepsaný certifikátem SignPath Foundation, SmartScreen'
            $lines += 'ho nemá proč blokovat. Podpis si ověříš příkazem'
            $lines += ''
            $lines += '```powershell'
            $lines += 'Get-AuthenticodeSignature .\RosDownloader.exe | Format-List'
            $lines += '```'
          } else {
            $lines += '**Tento soubor není podepsaný** – SmartScreen ho zablokuje.'
            $lines += '*Více informací → Přesto spustit*.'
          }
          $notes = $lines -join "`n"
          $notes | Out-File -FilePath notes.md -Encoding utf8
          # U existujícího releasu se popis nepřepisuje, takže ať je ten
          # odstavec aspoň po ruce ke zkopírování do ručně psaného textu.
          $notes | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag už existuje, jen vyměním přílohu"
            gh release upload $tag .\release\RosDownloader.exe --clobber
          } else {
            Write-Host "release $tag neexistuje, zakládám koncept"
            $title = "RosDownloader $($tag -replace '^v', '')"
            gh release create $tag .\release\RosDownloader.exe --draft --title $title --notes-file notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw "Nahrání k releasu selhalo" }

      # Při workflow_dispatch se nic nevydává, jen se dá stáhnout výsledek –
      # hodí se na vyzkoušení celé cesty včetně podpisu nanečisto.
      - name: Nahrání podepsaného artefaktu
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: RosDownloader
          path: release/RosDownloader.exe
          if-no-files-found: error
